<style>
/* Layout: a single-column training logbook. Sticky tab strip on top, the dated session as the working surface, stats and charts on their own tabs. Blue carries data, orange is reserved for PRs. */
:root{

  --f-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0e10; --surface:#16181b; --ink:#f2f3f5; --ink2:#b8bcc4; --muted:#8b9099;
    --line:#26292e; --line2:#363a41; --accent:#d7ff3f; --accent-ink:#0d0e10; --accent-line:transparent; --accent-soft:#232a10; --sel:#d7ff3f;
    --series:#d7ff3f; --pr:#ff8a4c; --pr-soft:#3a2117; --pr-ink:#ff8a4c; --good:#a8e04a; --danger:#ff6b6b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0e10; --surface:#16181b; --ink:#f2f3f5; --ink2:#b8bcc4; --muted:#8b9099;
  --line:#26292e; --line2:#363a41; --accent:#d7ff3f; --accent-ink:#0d0e10; --accent-line:transparent; --accent-soft:#232a10; --sel:#d7ff3f;
  --series:#d7ff3f; --pr:#ff8a4c; --pr-soft:#3a2117; --pr-ink:#ff8a4c; --good:#a8e04a; --danger:#ff6b6b;
  color-scheme:dark;
}
/* iOS 26 installed web apps under-report the viewport height by the top safe area (about 62pt on iPhone 17 Pro Max), leaving a gap under fixed bars. 100lvh is correct there, so the difference is the gap. It is 0 everywhere else. */
:root{--vgap:0px}
@media (display-mode: standalone){:root{--vgap:calc(100lvh - 100dvh)}}
html{min-height:100lvh}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(176px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{margin-bottom:14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:4px 2px}
.top h1{font:800 38px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.top span{color:var(--muted);font-size:13px}
.topr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.themebtn[aria-pressed="true"]{border-color:var(--sel);background:var(--accent-soft)}
.themebtn{background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font:600 12px var(--f-body);color:var(--ink);cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:calc(-1 * var(--vgap));z-index:16;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:120px;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:8px 0 2px;font:600 10.5px var(--f-body);color:var(--muted);cursor:pointer}
.tabs::after{content:"";position:absolute;left:0;right:0;top:100%;height:240px;background:var(--surface)}
.tabs button svg{width:22px;height:22px}

.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-8px;left:50%;width:44px;margin-left:-22px;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 1px var(--accent-line)}
.banner{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ink2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
h2{font:600 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px}
.ib{background:none;border:1px solid var(--line2);border-radius:8px;width:38px;height:38px;cursor:pointer;color:var(--ink2);font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib.plain{border-color:transparent;color:var(--muted)}
.ib.confirm{width:auto;padding-inline:10px;font-size:13px;font-weight:600;color:var(--danger);border-color:var(--danger)}
input[type=number],input[type=text],input[type=date],select{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-width:0;width:100%}

.datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px}

.acts{display:flex;gap:8px;flex-wrap:wrap}
.bdd>summary{list-style:none;cursor:pointer;color:var(--ink2);font-weight:600;padding:6px 0}
.bdd .card{margin-top:8px}
.exname{background:none;border:0;padding:0;margin:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;text-align:left;cursor:pointer}

.exrow b{display:block;font:600 15px var(--f-body)}
.exrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.excnt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.excnt i{font-style:normal}
.rng{font:800 20px/1 var(--f-display);color:var(--ink);letter-spacing:.02em}
.exc.done .excnt{color:var(--good);font-weight:700}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.stat b{display:block;font:700 34px/1.05 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat b small{font:500 14px var(--f-body);color:var(--muted);margin-left:3px}
.stat span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:2px}
.stat em.up{color:var(--good);font-weight:600}
.ex header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ex h3{font:700 22px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.exsum{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.last{font-size:13px;color:var(--muted);margin:0 0 10px;overflow-wrap:anywhere}
.srow,.addset{display:grid;grid-template-columns:22px minmax(0,1fr) 12px minmax(0,1fr) auto;gap:6px;align-items:center;padding-block:4px}
.srow+.srow{border-top:1px solid var(--line)}
.sn{font:600 14px var(--f-display);color:var(--muted);text-align:center}
.x{color:var(--muted);text-align:center}
.tail{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.sv{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.pr{display:inline-block;background:var(--pr-soft);color:var(--pr-ink);border:1px solid var(--pr);border-radius:5px;font:700 12px var(--f-display);letter-spacing:.08em;padding:1px 5px}
.addset{margin-top:6px;padding-top:10px;border-top:1px dashed var(--line2)}
.hint{font-size:12px;color:var(--danger);margin:4px 0 0}
.wform{display:flex;gap:8px;flex-wrap:wrap}
.wform input[type=date]{flex:1 1 150px;width:auto}
.wform input[type=number]{flex:1 1 110px;width:auto}
.addex{display:flex;gap:8px;flex-wrap:wrap}
.addex input[type=text]{flex:1 1 200px;width:auto}
.addex .mg{font-size:15px;padding:8px 10px}
.mtag{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;white-space:nowrap}
.empty{color:var(--ink2);text-align:center;padding:22px 12px}

.chart{position:relative;width:100%;min-height:60px}
.chart svg{display:block}

.chart .lbl{fill:var(--ink2);font-weight:600}
.chart .col .bar{fill:var(--series)}
.chart .col:hover .bar{opacity:.78}
.chart .pt .xh{stroke:var(--line2);stroke-dasharray:3 3;opacity:0}
.chart .pt.on .xh{opacity:1}
.chart .pt .dot{r:4;transition:r .1s}
.chart .pt.on .dot{r:6}
.key{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:8px 0 0}
.key i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pr);margin-right:5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools select{flex:1;min-width:160px;width:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--sel);color:var(--ink)}
.note{font-size:13px;color:var(--ink2);margin:8px 0 0}
details{margin-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--ink2)}
.tblw{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:4px 10px 4px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-bottom:8px}
.hbar div:first-child{overflow-wrap:anywhere;font-size:14px}
.hbar div:last-child{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hbar .track{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px}
.hbar .fill{height:8px;background:var(--series);border-radius:0 4px 4px 0}
.ev{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{color:var(--muted);font-size:13px;width:64px;flex:none}
.ev .n{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.best h3{font:700 20px var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bgrid div{min-width:0}

.bgrid span{display:block;font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

.hrow{border-bottom:1px solid var(--line);padding:10px 0}

.note-in{margin-bottom:8px;font-size:14px}

.restbar[hidden]{display:none}
.restbar{position:fixed;left:12px;right:12px;max-width:736px;margin-inline:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px) - var(--vgap));z-index:15;background:var(--accent);color:var(--accent-ink);border-radius:18px;box-shadow:inset 0 0 0 1.5px var(--accent-line),0 6px 16px rgba(0,0,0,.16);padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.rmain{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.rlbl{font-size:12px;letter-spacing:.05em;text-transform:uppercase;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmain b{font:800 32px/1 var(--f-display);font-variant-numeric:tabular-nums}
.rprog{flex:0 0 0;display:none;height:4px;background:rgba(127,127,127,.35);border-radius:2px;overflow:hidden}
.rprog i{display:block;height:4px;width:0;background:var(--accent-ink)}
.rbtns{display:flex;gap:6px;flex:none}

.rbtns button{background:rgba(127,127,127,.22);color:inherit;border:0;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}
.rbtns button:last-child{background:var(--accent-ink);color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function analyze(){
  var sess=Object.keys(S.sessions).map(function(k){return S.sessions[k]}).filter(Boolean).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  var ex={},setPR={},prEvents=[],weeks={},sessStats={},explicit={};
  sess.forEach(function(s){s.exercises.forEach(function(e){if(e.muscle)explicit[norm(e.name)]=e.muscle})});
  var muscleOf=function(name){return explicit[norm(name)]||guessMuscle(name)};
  sess.forEach(function(s){
    var st=sessStats[s.date]={vol:0,sets:0,exs:0,prs:0};
    var wk=weekStart(s.date), W=weeks[wk]||(weeks[wk]={vol:0,workouts:0,sets:0});
    s.exercises.forEach(function(e,ei){
      var key=norm(e.name); if(!key)return;
      var E=ex[key]||(ex[key]={key:key,name:e.name,history:[],all:[],maxW:0,maxWset:null,maxWdate:'',best1:0,best1set:null,best1date:'',bsv:0,bsvSet:null,bsvDate:'',bestSess:0,bestSessDate:'',lastDate:''});
      E.name=e.name;

        var w=Math.max(0,x.w),r=Math.floor(x.r); if(r<=0)return;
        n++;vol+=w*r;
        if(!top||w>top.w||(w===top.w&&r>top.r))top={w:w,r:r};
        if(r>maxReps)maxReps=r;
        var est=w>0?w*(1+r/30):0; if(est>b1)b1=est;
        var type=null;
        if(E.all.length){
          if(w>E.maxW)type='weight';
          else{var same=E.all.filter(function(y){return y.w===w});
            if(same.length&&r>Math.max.apply(null,same.map(function(y){return y.r})))type='reps'}
        }
        if(type){setPR[s.date+'|'+ei+'|'+si]=type;prN++;prEvents.push({date:s.date,name:e.name,w:w,r:r,type:type})}
        E.all.push({w:w,r:r});
        if(!E.maxWset||w>E.maxW||(w===E.maxW&&r>E.maxWset.r)){E.maxW=w;E.maxWset={w:w,r:r};E.maxWdate=s.date}
        if(est>E.best1){E.best1=est;E.best1set={w:w,r:r};E.best1date=s.date}
        if(w*r>E.bsv){E.bsv=w*r;E.bsvSet={w:w,r:r};E.bsvDate=s.date}
      });
      if(n>0){
        E.history.push({date:s.date,name:s.name,sets:n,vol:vol,top:top,maxReps:maxReps,e1:b1,prs:prN});
        if(vol>E.bestSess){E.bestSess=vol;E.bestSessDate=s.date}
        E.lastDate=s.date;st.vol+=vol;st.sets+=n;st.exs++;st.prs+=prN;W.vol+=vol;W.sets+=n;
      }
    });
    if(st.sets>0)W.workouts++;
  });
  return {muscleOf:muscleOf,sess:sess,ex:ex,setPR:setPR,prEvents:prEvents.reverse(),weeks:weeks,sessStats:sessStats};
}
function exList(A){return Object.keys(A.ex).map(function(k){return A.ex[k]}).sort(function(a,b){return a.lastDate<b.lastDate?1:a.lastDate>b.lastDate?-1:0})}

/* ---------- actions ---------- */
function ensureSession(name){
  var s=S.sessions[S.date];
  if(!s){s=S.sessions[S.date]={date:S.date,name:name||'',exercises:[],createdAt:Date.now(),sample:false}}
  else if(name!==undefined&&name!==null)s.name=name;
  return s;
}
function draftFor(ei){
  var k=S.date+'|'+ei; if(S.drafts[k])return S.drafts[k];
  var s=S.sessions[S.date], e=s&&s.exercises[ei], d={w:'',r:''};
  if(e){
    var last=e.sets[e.sets.length-1], lt=lastTime(e), nxt=lt&&lt.sets[e.sets.length];
    if(nxt)d={w:String(nxt.w||''),r:String(nxt.r||'')};
    else if(last)d={w:String(last.w||''),r:String(last.r||'')};
    else if(lt&&lt.sets.length)d={w:String(lt.sets[0].w||''),r:''};
  }

}
function lastTime(e){
  var E=S.A&&S.A.ex[norm(e.name)]; if(!E)return null;

  var s=S.sessions[h.date], ex=s&&s.exercises.filter(function(x){return norm(x.name)===norm(e.name)})[0]; if(!ex)return null;

function addSet(ei){

function act(a,b){

      var list=PROGRAM[nm].map(function(x){var m=keep.filter(function(e){return norm(e.name)===norm(x.n)})[0];if(m){used[norm(m.name)]=1;return m}return {name:x.n,muscle:x.m,sets:[]}});

  else if(a==='rmsess'){var id=b.dataset.date;confirmDo('sess'+id,function(){delete S.sessions[id];save(id);render()})}
  else if(a==='sample'){loadSample()}
  else if(a==='wsample'){loadSampleWeights()}

function loadSample(){

        exercises:PROGRAM[name].map(function(x,xi){
          var rg=/(\d+)\s*-\s*(\d+)/.exec(x.r), lo=+rg[1], hi=+rg[2], base=SAMPLE_W[norm(x.n)]||0, inc=base<40?2.5:5, w=base, rep=Math.min(hi,lo+k);

function agg(sess,A){

    var k=norm(e.name); if(!k)return;
    var v=0,n=0; e.sets.forEach(function(x){if(x.r>0){v+=x.w*x.r;n++}});
    if(!n)return;
    var m=A.muscleOf(e.name), o=byEx[k]||(byEx[k]={key:k,name:e.name,vol:0,sets:0}), q=byM[m]||(byM[m]={muscle:m,vol:0,sets:0});
    o.vol+=v;o.sets+=n;q.vol+=v;q.sets+=n;total+=v;sets+=n;

}

function muscleCard(A){

    });

/* ---------- charts ---------- */
var chartData={};
function ticks(min,max,n){
  var range=(max-min)||1, raw=range/n, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*p, lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, out=[];
  for(var v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(6));
  return out;
}
var tfmt=function(v){return Math.abs(v)>=1000?(+(v/1000).toFixed(1))+'k':String(v)};
function barChart(el,data,aria){
  var W=el.clientWidth; if(!W)return;
  var H=220,m={l:40,r:6,t:18,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  var mx=Math.max.apply(null,data.map(function(d){return d.value}).concat([0])), tk=ticks(0,mx||1,4), top=tk[tk.length-1];
  var y=function(v){return m.t+ih-(v/top)*ih}, band=iw/data.length, bw=Math.max(4,Math.min(34,band-4)), base=m.t+ih;
  var s='<svg width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(aria||'Bar chart')+'">';
  tk.forEach(function(t){s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)"/><text x="'+(m.l-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+tfmt(t)+'</text>'});
  s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+base+'" y2="'+base+'" stroke="var(--line2)"/>';
  var step=Math.ceil(40/band);
  data.forEach(function(d,i){
    var x=m.l+band*i+(band-bw)/2, h=(d.value/top)*ih, r=Math.min(4,h,bw/2);
    s+='<g class="col" data-i="'+i+'">';
    if(h>0)s+='<path class="bar" d="M'+x+','+base+' V'+(base-h+r)+' a'+r+','+r+' 0 0 1 '+r+','+(-r)+' H'+(x+bw-r)+' a'+r+','+r+' 0 0 1 '+r+','+r+' V'+base+' Z"/>';
    else s+='<rect x="'+x+'" y="'+(base-2)+'" width="'+bw+'" height="2" fill="var(--line2)"/>';
    if(d.cur&&d.value>0)s+='<text class="lbl" x="'+(x+bw/2)+'" y="'+(base-h-5)+'" text-anchor="middle">'+nf(d.value)+'</text>';
    if((data.length-1-i)%step===0)s+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(d.label)+'</text>';
    s+='<rect x="'+(m.l+band*i)+'" y="'+m.t+'" width="'+band+'" height="'+(ih+m.b)+'" fill="transparent"/></g>';
  });
  el.innerHTML=s+'</svg>';
}
function lineChart(el,data){
  var W=el.clientWidth; if(!W)return;
  var H=240,m={l:44,r:16,t:20,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b;
  var vals=data.map(function(d){return d.value}), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mn===mx){var pd=Math.max(1,mn*0.05);mn-=pd;mx+=pd}else{var q=(mx-mn)*0.1;mn-=q;mx+=q}
  if(mn<0)mn=0;
  var tk=ticks(mn,mx,4), lo=tk[0], hi=tk[tk.length-1], base=m.t+ih;
  var y=function(v){return m.t+ih-((v-lo)/(hi-lo))*ih};
  var t0=data[0].t, t1=data[data.length-1].t;
  var x=function(t){return data.length===1||t1===t0?m.l+iw/2:m.l+((t-t0)/(t1-t0))*iw};
  var s='<svg width="'+W+'" height="'+H+'" role="img" aria-label="Progress over time for the selected exercise">';
  tk.forEach(function(t){s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)"/><text x="'+(m.l-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+tfmt(t)+'</text>'});
  s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+base+'" y2="'+base+'" stroke="var(--line2)"/>';
  if(data.length>1){
    var path=data.map(function(d,i){return (i?'L':'M')+x(d.t)+','+y(d.value)}).join(' ');
    s+='<path d="'+path+' L'+x(t1)+','+base+' L'+x(t0)+','+base+' Z" fill="var(--series)" opacity=".09"/>';
    s+='<path d="'+path+'" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  var nt=Math.max(1,Math.min(5,Math.floor(iw/80)));
  if(data.length===1||t1===t0)s+='<text x="'+x(t0)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(data[0].label)+'</text>';
  else for(var i=0;i<nt;i++){var tt=t0+(t1-t0)*(nt===1?0:i/(nt-1)), ds=new Date(tt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    s+='<text x="'+x(tt)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===nt-1?'end':'middle')+'">'+ds+'</text>'}
  data.forEach(function(d,i){
    var px=x(d.t), l=i===0?m.l:(x(data[i-1].t)+px)/2, r=i===data.length-1?W-m.r:(px+x(data[i+1].t))/2;
    s+='<g class="pt" data-i="'+i+'"><line class="xh" x1="'+px+'" x2="'+px+'" y1="'+m.t+'" y2="'+base+'"/>'+
      '<circle class="dot" cx="'+px+'" cy="'+y(d.value)+'" r="4" fill="'+(d.pr?'var(--pr)':'var(--series)')+'" stroke="var(--surface)" stroke-width="2"/>'+
      '<rect x="'+l+'" y="'+m.t+'" width="'+Math.max(2,r-l)+'" height="'+(ih+m.b)+'" fill="transparent"/></g>';
  });
  var last=data[data.length-1];
  s+='<text class="lbl" x="'+Math.min(x(last.t),W-m.r-8)+'" y="'+(y(last.value)-11)+'" text-anchor="middle">'+(function(){var v=last.value;return S.metric==='vol'?nf(v):S.metric==='e1rm'?Math.round(v):num(v)})()+'</text>';
  el.innerHTML=s+'</svg>';
}

function saveMeasure(){
  var ex=S.weights[S.wDate], base=ex&&!ex.sample?ex:cleanBody({},S.wDate), m=Object.assign({},base.m), any=false;
  MFIELDS.forEach(function(f){var el=document.getElementById('m-'+f[0]),v=parseFloat(el&&el.value);if(v>=5&&v<=100){m[f[0]]=Math.round(v*10)/10;any=true}});
  if(!any){S.mHint='Enter at least one measurement in inches.';render();return}
  S.mHint='';
  S.weights[S.wDate]={date:S.wDate,w:base.w||0,bf:base.bf||0,m:m,sample:false};
  S.mDraft={};wsave(S.wDate);render();
}
function measureCard(){
  var cur=S.weights[S.wDate], cm=(cur&&cur.m)||{};
  var h='<section class="card"><h2>Measurements (in)</h2><form id="measureForm"><div class="mgrid">'+MFIELDS.map(function(f){
    var v=S.mDraft[f[0]]!==undefined?S.mDraft[f[0]]:(cm[f[0]]>0?String(cm[f[0]]):'');
    return '<label>'+f[1]+'<input type="number" step="0.1" min="0" inputmode="decimal" id="m-'+f[0]+'" data-mf="'+f[0]+'" value="'+esc(v)+'"></label>';
  }).join('')+'</div><button class="btn" type="submit">Save for '+esc(fmtShort(S.wDate))+'</button></form>';
  if(S.mHint)h+='<p class="hint" role="alert">'+esc(S.mHint)+'</p>';
  var ents=Object.keys(S.weights).map(function(k){return S.weights[k]}).filter(Boolean).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  var rows=MFIELDS.map(function(f){
    var l=ents.filter(function(x){return x.m&&x.m[f[0]]>0}); if(!l.length)return null;
    var a=l[0].m[f[0]], b=l[l.length-1].m[f[0]];
    return '<tr><td>'+f[1]+'</td><td>'+num(b)+' in</td><td>'+num(a)+' in</td><td>'+(l.length>1?sgn(b-a)+' in':'—')+'</td></tr>';
  }).filter(Boolean);
  h+=rows.length?'<div class="tblw"><table><thead><tr><th>Measurement</th><th>Latest</th><th>First</th><th>Change</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<p class="note">Log a measurement to start tracking. Measure the same spot at the same time of day.</p>';
  return h+'</section>';
}
function loadSampleWeights(){
  var td=todayStr();
  for(var i=21;i>=1;i--){
    var id=addDays(td,-i); if(S.weights[id])continue;
    var k=21-i; S.weights[id]=cleanBody({date:id,w:Math.round((186.4-0.07*k+0.7*Math.sin(k*1.7))*10)/10,sample:true},id);
    wsave(id);
  }
  render();
}
function viewWeight(){
  var all=wList(), td=todayStr(), cur=S.weights[S.wDate], hasW=!!(cur&&cur.w>0);
  var wd=S.wDraft!==null?S.wDraft:(hasW?String(cur.w):''), bd=S.bfDraft!==null?S.bfDraft:(cur&&cur.bf>0?String(cur.bf):'');
  var h='<div class="stack"><form class="wform" id="weightForm"><input type="date" id="wDate" value="'+esc(S.wDate)+'" aria-label="Date"><input type="number" id="wIn" step="0.1" min="0" inputmode="decimal" placeholder="Weight (lb)" value="'+esc(wd)+'" aria-label="Weight in pounds"><input type="number" id="bfIn" step="0.1" min="0" max="70" inputmode="decimal" placeholder="Body fat %" value="'+esc(bd)+'" aria-label="Body fat percent, optional"><button class="btn" type="submit">'+(hasW?'Update':'Save')+'</button></form>';
  if(S.wHint)h+='<p class="hint" role="alert">'+esc(S.wHint)+'</p>';
  if(!all.length){
    h+='<div class="card empty"><p>Log your weight each morning and this page shows your 7-day average trend.</p><div class="row"><button class="btn ghost" data-act="wsample">Preview with sample data</button></div></div>';
  }else{
    var latest=all[all.length-1], first=all[0], a7=wAvg(all,addDays(td,-6),td), p7=wAvg(all,addDays(td,-13),addDays(td,-7));
    var wk=(a7!==null&&p7!==null)?a7-p7:null, tot=latest.w-first.w, bfs=all.filter(function(x){return x.bf>0});
    var n7=all.filter(function(x){return x.date>=addDays(td,-6)&&x.date<=td}).length;
    h+='<div class="stats">'+statTile(num(latest.w),'lb','Latest',esc(fmtShort(latest.date)))+
      statTile(a7===null?'—':num(a7),a7===null?'':'lb','7-day average',a7===null?'No entries this week':n7+' entr'+(n7===1?'y':'ies'))+
      statTile(wk===null?'—':sgn(wk),wk===null?'':'lb','Weekly change',wk===null?'Needs two weeks of entries':'7-day average vs the 7 days before')+
      statTile(sgn(tot),'lb','Since first entry','Started '+esc(fmtShort(first.date)))+
      (bfs.length?statTile(num(bfs[bfs.length-1].bf),'%','Body fat',bfs.length>1?sgn(bfs[bfs.length-1].bf-bfs[0].bf)+' pts since '+esc(fmtShort(bfs[0].date)):'First entry '+esc(fmtShort(bfs[0].date))):'')+'</div>';
    var data=weightData();
    h+='<section class="card"><h2>Weight trend</h2><div class="seg" role="group" aria-label="Range">'+[['30','30 days'],['90','90 days'],['all','All time']].map(function(r){return '<button data-act="wrange" data-r="'+r[0]+'" aria-pressed="'+(S.wRange===r[0])+'">'+r[1]+'</button>'}).join('')+'</div>';
    if(!data.length)h+='<p class="empty">No weigh-ins in this range.</p>';
    else h+=chartCard('chW')+'<div class="key"><span><i style="background:var(--series);opacity:.5"></i>Daily weight</span><span><i style="width:16px;height:3px;border-radius:2px;background:var(--series)"></i>7-day average</span></div>'+
      tableFor(data.map(function(d){return [d.label,num(d.value)+' lb',num(d.avg)+' lb']}),['Date','Weight','7-day average']);
    h+='</section><section class="card"><h2>Recent weigh-ins</h2>'+all.slice(-14).reverse().map(function(x){
      var c=S.confirm==='w'+x.date;
      return '<div class="ev"><span class="d">'+esc(fmtShort(x.date))+'</span><span class="n">'+(x.sample?'<span class="tag" style="margin:0">Sample</span>':'')+'</span><span class="v">'+num(x.w)+' lb'+(x.bf>0?' · '+num(x.bf)+'%':'')+'</span><button class="ib'+(c?' confirm':' plain')+'" data-act="rmw" data-date="'+x.date+'" aria-label="Delete weigh-in for '+esc(fmtShort(x.date))+'">'+(c?'Delete?':'✕')+'</button></div>';
    }).join('')+'</section>';
  }
  h+=measureCard();
  if(all.some(function(x){return x.sample}))h+='<p class="note"><button class="btn danger sm" data-act="rmsample">'+(S.confirm==='sample'?'Remove all sample data?':'Remove sample data')+'</button></p>';
  return h+'</div>';
}
function weightChart(el,data){
  var W=el.clientWidth; if(!W)return;
  var H=240,m={l:46,r:16,t:22,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b, vals=[];
  data.forEach(function(d){vals.push(d.value,d.avg)});
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), pd=Math.max(0.5,(mx-mn)*0.15); mn-=pd;mx+=pd;
  var tk=ticks(mn,mx,4), lo=tk[0], hi=tk[tk.length-1], base=m.t+ih;
  var y=function(v){return m.t+ih-((v-lo)/(hi-lo))*ih};
  var t0=data[0].t, t1=data[data.length-1].t;
  var x=function(t){return data.length===1||t1===t0?m.l+iw/2:m.l+((t-t0)/(t1-t0))*iw};
  var s='<svg width="'+W+'" height="'+H+'" role="img" aria-label="Daily weight with a 7-day average line">';
  tk.forEach(function(t){s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)"/><text x="'+(m.l-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+tfmt(t)+'</text>'});
  s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+base+'" y2="'+base+'" stroke="var(--line2)"/>';
  if(data.length>1)s+='<path d="'+data.map(function(d,i){return (i?'L':'M')+x(d.t)+','+y(d.avg)}).join(' ')+'" fill="none" stroke="var(--series)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var nt=Math.max(1,Math.min(5,Math.floor(iw/80)));
  if(data.length===1||t1===t0)s+='<text x="'+x(t0)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(data[0].label)+'</text>';
  else for(var i=0;i<nt;i++){var tt=t0+(t1-t0)*(nt===1?0:i/(nt-1)), ds=new Date(tt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    s+='<text x="'+x(tt)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===nt-1?'end':'middle')+'">'+ds+'</text>'}
  data.forEach(function(d,i){
    var px=x(d.t), l=i===0?m.l:(x(data[i-1].t)+px)/2, r=i===data.length-1?W-m.r:(px+x(data[i+1].t))/2;
    s+='<g class="pt" data-i="'+i+'"><line class="xh" x1="'+px+'" x2="'+px+'" y1="'+m.t+'" y2="'+base+'"/>'+
      '<circle class="dot" cx="'+px+'" cy="'+y(d.value)+'" r="4" fill="var(--series)" fill-opacity=".5" stroke="var(--surface)" stroke-width="2"/>'+
      '<rect x="'+l+'" y="'+m.t+'" width="'+Math.max(2,r-l)+'" height="'+(ih+m.b)+'" fill="transparent"/></g>';
  });
  var last=data[data.length-1];
  s+='<circle cx="'+x(last.t)+'" cy="'+y(last.avg)+'" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2" pointer-events="none"/>'+
    '<text class="lbl" x="'+Math.min(x(last.t),W-m.r-14)+'" y="'+(y(last.avg)-12)+'" text-anchor="middle">'+num(last.avg)+'</text>';
  el.innerHTML=s+'</svg>';
}

  try{if(fid&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}

  h+='<nav class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+TAB_ICONS[t[0]]+'"/></svg><span>'+t[1]+'</span></button>'}).join('')+'</nav>';

}

var ROOT=document.documentElement, THEME_ORIG=ROOT.getAttribute('data-theme');
function applyTheme(){if(S.theme==='auto'){if(THEME_ORIG)ROOT.setAttribute('data-theme',THEME_ORIG);else ROOT.removeAttribute('data-theme')}else ROOT.setAttribute('data-theme',S.theme)}
var TAB_ICONS={log:'M3 12h18M6.5 7.5v9M17.5 7.5v9M3 10v4M21 10v4',progress:'M3 17l6-6 4 4 8-9',prs:'M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z',weight:'M12 4a4 4 0 1 0 0 8a4 4 0 1 0 0-8M4 21c0-4 4-6 8-6s8 2 8 6',history:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7.5V12l3 2'};

/* ---------- rest timer ---------- */
function parseRest(t){var m=/(\d+)(?:\s*-\s*(\d+))?\s*(min|s)/i.exec(t||'');if(!m)return 90;return m[3].toLowerCase()==='min'?(+m[1])*60:+m[1]}
function fmtT(sec){sec=Math.max(0,sec);return Math.floor(sec/60)+':'+pad(sec%60)}
function beep(){
  try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=0.08;o.connect(g);g.connect(c.destination);o.start();setTimeout(function(){try{o.stop();c.close()}catch(e){}},350)}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(200)}catch(e){}
}
function tickRest(){
  var el=document.getElementById('rest'), r=S.rest;
  if(!r){el.hidden=true;clearInterval(restT);restT=0;return}
  var left=Math.ceil((r.end-Date.now())/1000), t=document.getElementById('restTime'), f=document.getElementById('restFill'), l=document.getElementById('restLbl');
  el.hidden=false;
  if(left>0){t.textContent=fmtT(left);f.style.width=Math.min(100,Math.max(0,100*(1-left/r.total)))+'%';l.textContent='Rest · '+r.label}
  else{
    if(!r.done){r.done=true;beep()}
    t.textContent='+'+fmtT(-left);f.style.width='100%';l.textContent='Rest done · '+r.label;
    if(-left>120){S.rest=null;tickRest()}
  }
}
function startRest(secs,label){
  S.rest={end:Date.now()+secs*1000,total:secs,label:label,done:false};
  clearInterval(restT);restT=setInterval(tickRest,250);tickRest();
}

/* ---------- export ---------- */
function csvCell(v){v=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(rows){return rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n')}
function exportCard(){
  if(!dl)return '';
  return '<section class="card"><h2>Export your data</h2><div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-act="export" data-k="workouts">Workouts (CSV)</button><button class="btn ghost sm" data-act="export" data-k="body">Weight and measurements (CSV)</button></div>'+(S.exportMsg?'<p class="note" role="status">'+esc(S.exportMsg)+'</p>':'')+'<p class="note">CSV files open in Excel or Google Sheets. The workouts file has one row per set.</p></section>';
}
function exportData(kind){
  if(!dl)return;
  var rows,name,td=todayStr();
  if(kind==='workouts'){
    var A=analyze();
    rows=[['Date','Workout','Exercise','Muscle group','Set','Weight (lb)','Reps','Volume (lb)','PR','Exercise note','Workout note','Sample']];
    A.sess.forEach(function(s){s.exercises.forEach(function(e,ei){e.sets.forEach(function(x,si){
      if(!(x.r>0))return;
      var pr=A.setPR[s.date+'|'+ei+'|'+si];
      rows.push([s.date,s.name,e.name,A.muscleOf(e.name),si+1,x.w,x.r,x.w*x.r,pr==='weight'?'Weight PR':pr==='reps'?'Rep PR':'',e.note||'',s.note||'',s.sample?'yes':'']);
    })})});
    name='lift-log-workouts-'+td+'.csv';
  }else{
    rows=[['Date','Weight (lb)','Body fat %','Waist (in)','Chest (in)','Arms (in)','Thighs (in)','Sample']];
    Object.keys(S.weights).sort().forEach(function(id){var b=S.weights[id];if(!b)return;var m=b.m||{};rows.push([b.date,b.w||'',b.bf||'',m.waist||'',m.chest||'',m.arms||'',m.thighs||'',b.sample?'yes':''])});
    name='lift-log-body-'+td+'.csv';
  }
  if(rows.length<2){S.exportMsg='Nothing to export yet.';render();return}
  S.exportMsg='';
  dl.save({filename:name,data:'﻿'+toCsv(rows)}).then(function(){S.exportMsg='File ready: '+name;render()},function(e){S.exportMsg=(e&&e.code==='declined')?'':'Could not save the file ('+((e&&e.code)||'error')+').';render()});
}

/* ---------- events ---------- */
app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b&&app.contains(b))act(b.dataset.act,b)});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='wIn'){S.wDraft=t.value}
  if(t.id==='bfIn'){S.bfDraft=t.value}
  if(t.dataset&&t.dataset.mf!==undefined){S.mDraft[t.dataset.mf]=t.value}
  if(t.id==='exIn'&&S.A){var ms=document.getElementById('exMuscle');if(ms)ms.value=S.A.muscleOf(t.value)}
  if(t.dataset&&t.dataset.draft){var k=S.date+'|'+t.dataset.ei,d=S.drafts[k]||(S.drafts[k]=draftFor(+t.dataset.ei));d[t.dataset.draft]=t.value}
});
app.addEventListener('change',function(e){
  var t=e.target, s=S.sessions[S.date];
  if(t.id==='dateIn'){if(t.value){S.date=t.value;render()}return}
  if(t.id==='exSel'){S.exSel=t.value;render();return}
  if(t.id==='progIn'){setProgStart(t.value);return}
  if(t.id==='wDate'){if(t.value){S.wDate=t.value;S.wDraft=null;S.bfDraft=null;S.mDraft={};S.wHint='';S.mHint='';render()}return}
  if(t.id==='sessNote'){if(s){s.note=t.value.trim();save(S.date);render()}return}
  if(t.dataset&&t.dataset.chg==='note'){var ex2=s&&s.exercises[+t.dataset.ei];if(ex2){ex2.note=t.value.trim();save(S.date);render()}return}
  if(t.dataset&&t.dataset.chg&&s){
    var ex=s.exercises[+t.dataset.ei], st=ex&&ex.sets[+t.dataset.si]; if(!st)return;
    var v=parseFloat(t.value);
    if(t.dataset.chg==='w')st.w=isFinite(v)&&v>0?v:0; else st.r=isFinite(v)&&v>0?Math.floor(v):0;
    save(S.date);render();
  }
});
app.addEventListener('toggle',function(e){if(e.target.classList&&e.target.classList.contains('bdd'))S.bdOpen=e.target.open},true);
app.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Enter'&&t.dataset&&t.dataset.draft){e.preventDefault();addSet(+t.dataset.ei)}
  if((e.key==='Escape'||e.key==='Enter')&&isNoteBox(t)){e.preventDefault();t.blur()}
});
function isNoteBox(t){return t&&(t.id==='sessNote'||(t.classList&&t.classList.contains('note-in')))}
app.addEventListener('focusout',function(e){
  var t=e.target;if(!isNoteBox(t))return;
  setTimeout(function(){
    if(!document.body.contains(t)||document.activeElement===t||t.value.trim())return;
    var k=t.id==='sessNote'?S.date+'|s':S.date+'|'+t.id.replace('note-','');

  },250);
});
app.addEventListener('submit',function(e){
  if(e.target.id==='weightForm'){e.preventDefault();saveWeight();return}
  if(e.target.id==='measureForm'){e.preventDefault();saveMeasure();return}
  if(e.target.id!=='addexForm')return;
  e.preventDefault();
  var inp=document.getElementById('exIn'), name=inp.value.trim().replace(/\s+/g,' '); if(!name)return;
  var s=ensureSession(), key=norm(name), known=exList(S.A||analyze()).filter(function(x){return x.key===key})[0];
  var msel=document.getElementById('exMuscle'), mv=msel?msel.value:'';
  s.exercises.push({name:known?known.name:name,muscle:mv==='Other'?'':mv,sets:[]});
  S.drafts[S.date+'|'+(s.exercises.length-1)]=null;delete S.drafts[S.date+'|'+(s.exercises.length-1)];
  S.showAdd=false;save(S.date);render();
  var ni=document.getElementById('aw-'+(s.exercises.length-1));if(ni)ni.focus();
});

function hideTip(){tipEl.hidden=true;document.querySelectorAll('.chart .pt.on').forEach(function(x){x.classList.remove('on')})}
function tipMove(e){
  var g=e.target.closest&&e.target.closest('.chart [data-i]');
  if(!g)return hideTip();
  var ch=g.closest('.chart'), d=chartData[ch.id], it=d&&d[+g.dataset.i]; if(!it)return hideTip();
  tipEl.innerHTML=it.tip.filter(Boolean).map(function(l,i){return '<div'+(i===0?' class="t0"':'')+'>'+esc(l)+'</div>'}).join('');
  tipEl.hidden=false;
  var w=tipEl.offsetWidth,h=tipEl.offsetHeight, x=Math.min(e.clientX+14,window.innerWidth-w-8), yy=e.clientY-h-12;
  if(yy<8)yy=e.clientY+18;
  tipEl.style.left=Math.max(8,x)+'px';tipEl.style.top=yy+'px';
  ch.querySelectorAll('.pt.on').forEach(function(x){x.classList.remove('on')});
  if(g.classList.contains('pt'))g.classList.add('on');
}
['pointerover','pointermove','pointerdown'].forEach(function(n){app.addEventListener(n,tipMove)});
app.addEventListener('pointerout',function(e){if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.chart'))hideTip()});
window.addEventListener('scroll',hideTip,{passive:true});
document.getElementById('rest').addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-rest]'); if(!b||!S.rest)return;
  var v=b.dataset.rest;
  if(v==='skip'){S.rest=null}else{var d=parseInt(v,10)*1000;S.rest.end+=d;S.rest.total=Math.max(5,S.rest.total+d/1000);S.rest.done=false}
  tickRest();
});
var rz=0;window.addEventListener('resize',function(){cancelAnimationFrame(rz);rz=requestAnimationFrame(drawCharts)});

applyTheme();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
lsLoad();
window.addEventListener('online',syncNow);
window.addEventListener('pagehide',lsWrite);
render();
initDb();
})();
